          type: string
          readOnly: true
        delivery_address_line:
          type: string
          readOnly: true
        delivery_landmark:
          type: string
          readOnly: true
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        delivery_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        notes:
          type: string
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - delivery_address_line
      - delivery_area_name
      - delivery_fee
      - delivery_landmark
      - discount
      - id
      - items
      - notes
      - order_number
      - payment_method
      - payment_status
      - recipient_name
      - recipient_phone
      - status
      - subtotal
      - total_amount
    CustomerProduct:
