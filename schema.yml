  /api/inventory/movements/:
    get:
      operationId: inventory_movements_list
      parameters:
      - in: query
        name: movement_type
        schema:
          type: string
          enum:
          - ADJUSTMENT_IN
          - ADJUSTMENT_OUT
          - CUSTOMER_RETURN
          - DAMAGE
          - PURCHASE
          - RELEASE
          - RESERVE
          - SALE
        description: |-
          * `PURCHASE` - Purchase
          * `SALE` - Sale
          * `CUSTOMER_RETURN` - Customer Return
          * `DAMAGE` - Damage
          * `ADJUSTMENT_IN` - Adjustment In
          * `ADJUSTMENT_OUT` - Adjustment Out
          * `RESERVE` - Reserve
          * `RELEASE` - Release
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: product
        schema:
          type: integer
      - name: search
        required: false
        in: query
