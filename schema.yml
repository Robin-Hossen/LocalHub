components:
  schemas:
    AddressTypeEnum:
      enum:
      - HOME
      - OFFICE
      - OTHER
      type: string
      description: |-
        * `HOME` - Home
        * `OFFICE` - Office
        * `OTHER` - Other
    Area:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        parent:
          type: integer
          nullable: true
      required:
      - id
      - name
    CODCollectionCreate:
      type: object
      properties:
        order_id:
          type: integer
          minimum: 1
        amount_collected:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        notes:
          type: string
      required:
      - amount_collected
      - order_id
    CODCollectionCreateRequest:
      type: object
      properties:
        order_id:
          type: integer
          minimum: 1
        amount_collected:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        notes:
          type: string
      required:
      - amount_collected
      - order_id
    CODCollectionResponse:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        order:
          type: integer
          readOnly: true
        order_number:
          type: string
          readOnly: true
        amount_collected:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        collected_by:
          type: integer
          readOnly: true
        collected_by_email:
          type: string
          readOnly: true
        notes:
          type: string
          readOnly: true
        collected_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount_collected
      - collected_at
      - collected_by
      - collected_by_email
      - id
      - notes
      - order
      - order_number
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        slug:
          type: string
          maxLength: 170
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        image:
          type: string
          format: uri
          nullable: true
        parent:
          type: integer
          nullable: true
        parent_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - parent_name
      - slug
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        slug:
          type: string
          minLength: 1
          maxLength: 170
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        image:
          type: string
          format: binary
          nullable: true
        parent:
          type: integer
          nullable: true
        is_active:
          type: boolean
      required:
      - name
      - slug
    CustomerAddress:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        address_type:
          $ref: '#/components/schemas/AddressTypeEnum'
        recipient_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 20
        area:
          type: integer
        area_name:
          type: string
          readOnly: true
        address_line:
          type: string
        landmark:
          type: string
          maxLength: 255
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address_line
      - area
      - area_name
      - created_at
      - id
      - phone
      - recipient_name
    CustomerAddressRequest:
      type: object
      properties:
        address_type:
          $ref: '#/components/schemas/AddressTypeEnum'
        recipient_name:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          minLength: 1
          maxLength: 20
        area:
          type: integer
        address_line:
          type: string
          minLength: 1
        landmark:
          type: string
          maxLength: 255
        is_default:
          type: boolean
      required:
      - address_line
      - area
      - phone
      - recipient_name
    CustomerOrder:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        order_number:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/Status657Enum'
          readOnly: true
        payment_method:
          allOf:
          - $ref: '#/components/schemas/PaymentMethodEnum'
          readOnly: true
        payment_status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatusEnum'
          readOnly: true
        recipient_name:
          type: string
          readOnly: true
        recipient_phone:
